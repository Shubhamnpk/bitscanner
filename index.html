    <!-- PWA & iOS Safari Compliance -->
    <meta name="theme-color" content="#0d9488" />
    <script>
      // Apply the saved theme before first paint so a dark-theme reload never flashes light.
      // Mirrors resolveTheme() in src/utils/theme.ts; the key lives in src/utils/settingsStore.ts.
      (function () {
        try {
          var raw = localStorage.getItem('camscan_studio_settings_v1');
          var mode = raw ? JSON.parse(raw).theme : 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!dark) return;
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#080e18');
        } catch (error) {
          /* storage blocked: fall back to the light default */
        }
      })();
    </script>
